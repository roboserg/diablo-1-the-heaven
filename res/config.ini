
//----- SYSTEM OPTIONS -----

set screenwidth 1256 // min recommended is 800, max 3840 (don't increase it unless you need to. it's tiles, not textures. higher rez only increases field of view, not quality)
set screenheight 794 // min recommended is 594, max 2160
set fullscreen winon // set to "on" to play in fullscren mode, "off" to play in windowed mode, "winon" to play in window borderless mode, or "winoff" to play in window mode
set fps 60 // set render speed limit, can range from 20 to 10000. Warning: higher values increase CPU load!
set LowCpuUsage off // lowers CPU load but can make interpolation look worse (jittery). Activate if your CPU temperature (and/or fan speed) increases too much
set showfps off // toggle in-game display of frames per second
set Vsync off // toggle vertical synchronization, might be better to set to off if you have visual problems (sometimes g-sync needs it off too)
set startvideo off // this option defines if cinematics are played when the game starts, set to off if you want to skip cinematics on start
set BackgroundDraw on // on by default, setting it to off will stop background rendering
set DDraw off // game uses Direct3D, with this option you can have DDraw render (lets you play on Linux/iOS, but use it if you know what you're doing - it gives worse visual quality), off by default
set LimitCpuCore off // limits CPU usage to one core (first), use it in case you have "invalid save file" error when trying to load a save
// DynamicZoom: zoom the game world in and out with the mouse wheel (wheel up = closer, wheel down = back), centred on your hero; 
// panels, text and the cursor keep their size. The higher your resolution, the closer you can zoom (up to 4.5x at 1920x1080). 
// while on, the wheel zooms instead of switching hotkeyed spells (swapSpellsOnScroll). Does not work in Classic mode or with ForceZoom. On by default.
set DynamicZoom on



//----- SOUND OPTIONS -----

set BackgroundSound on // on by default, setting it to off will mute game sounds when it is in the background
set OriginalMusic off // off by default, setting it to on will use only original game music (in original quality too)
set Doom_Music off // off by default, activating it will play Doom 2 music (it's not very serious, added it just for fun), takes precedence over original music
set MonsterWalkSounds on // this option activates monster walking sounds if they are nearby, on by default
set PlayerRunningSounds 2 // this option activates player footstep sounds: running and walking ('2'), only when walking ('1'), mute run and walk sfx for player ('0')



//----- GAMEPLAY & CONTROL OPTIONS -----

set runindungeon on // toggle running outside of battle mode
set autopickup on // toggle gold autopickup
set easyclick on // toggle auto-clicking with mouse buttons pressed
set althold off // toggle Alt key press/hold function ('on' means you have to keep Alt pressed to highlight items)
set AltOnlyItemPick off // pick up items from the floor only if highlighted with Alt, off by default
set skipvictory off // toggle skipping end cinematics by mouse clicking, off by default
set SwapSpellsOnScroll on // mouse-scroll through hotkeyed spells
set RandomizeSPQuests off // chooses randomly from the pool of quests in SP (MP unaffected), if you set it to off all quests will be present in every game (if you change this, do not load game, start new)
set NewDunConfirm off // SP Ironman mode option only. If set to 'on', it will make a confirmation window pop up when trying to descend deeper (press Enter to proceed)
set ExtraMouseButtons on // toggle activating mouse buttons 4 & 5. Back button works as Alt, forward - as Shift. Off by default
set SecondaryTooltip on // by default, items under cursor will be compared to equipped items of the same type, set to 'off' to turn this feature off
set DisableESCinBattle off //off by default, this option prevents accidental menu pop-ups in SP Ironman mode if player hits ESC by accident (works for alive characters and only in combat)
set ForceMoveOnCtrl on // off by default, it allows player to press left-click and move around without interrupting for attacks or activating objects (if ON, it deactivates Hydra hotkey!)
set DropItemOnCtrl on // on by default, it allows pressing Ctrl+LeftClick on an inventory item to quickly drop it on the floor
set RestrictMouseToWindow on // on by default, defines mouse behavior when game is in windowed mode: 'on' disallows clicking outside game window, 'off' allows it
set XinputEnabled off // off by default, it enables control through gamepad if it is attached and this option is set to 'on'
set KeepSpellsOnCtrls off // call a spell bound to CTRL while ForceMoveOnCtrl and\or DropItemOnCtrl is\are also functionable
set FastInventoryItemSwap on // allows quick items equip (or unequip) with Shift-Click if set to 'on', otherwise - not (on by default)
set FastSwapRightOnAlt on // works only if option `FastInventoryItemSwap` is activated. Allows swapping right ring and right weapon (for dual wielders) with ALT+LMB
set RememberPerkSelection on // remember previous perk/synergy position
set DropRares on // on by default, set it to 'off' if you want rare items to stop dropping (existing rare items will stay intact)
set TransmuteShowRecipeList on // shows recipe list in transmute panel, off by default
set ShowItemLevelOnGround off // Show unidentified item level in brackets before the item name on the ground (Alt highlight)
set ShowSocketsOnGround on // Show the socket count after the item name on the ground, like Long Sword [3] (Alt highlight)
set UniqueDropSound on // Play an extra sound when a unique or set item drops
set LevelClearedSound on // Play a sound when the last monster of a level dies (Ironman and Survival keep their own sound)
set BattleLockdown on // Single player, Normal and Hard: set it to off to save, town portal and leave a level in a fight and in a quest area with monsters left, as in Easy
set SigilDropRate 100 // How often sigils drop, in percent of the game's own chance: 0 ... 1000. In multiplayer it changes only your own drops



//----- VISUAL OPTIONS -----

set panel on // set to 'on' to see blue mana orb instead of black
set potion on // set to 'on' to see blue mana potions (this should also make dexterity elixir black for distinction)
set original_palettes on // set to 'on' if you want level color palettes get back to original
set BlueTownPortal on // set to 'on' if you want town portal to be blue, otherwise it will be yellow (off by default)
set mapblend on // map transparency on/off (on by default)
set showNumbersOnHealth on // toggle forced display of life info on life orb
set showNumbersOnMana on // toggle forced display of mana info on mana orb
set alwaysHighlightSummons on // toggle golem being highlighted all the time (on by default)
set showMonsterHealthBar on // toggle displaying monster info above their heads, like in modern aRPG games. Shows immunities, hit points, monster type, buffs/debuffs
set AlternativeMonsterBarBorder on // set to 'off' if you want rectangular border around monster hp bar (on by default)
set showVersionOnScreen on // set to 'on' to see game version and more on the top of the screen (off by default)
set RedInactiveSpellIcons off // shows inactive spell icons in red if 'on', grey if 'off' (off by default)
set centeredpanels off // toggle panels layout mode (centered: on, album: off) (off by default)
set NpcSign on // show exclamation marks above NPCs if they have a quest or message for you (on by deafult)
set ShowObjectsOnMiniMap off // 'on' makes highlight chests and barrels on automap in all modes, 'off' leaves that active only in Ironman and Survival modes
set ShowMonsterStunThreshold off // displays monster current stun threshold on monster HP bar when set to 'on' (off by default)
set CanSwitchPerkSynergyPanel on // allows using left and right arrow keys to switch between Perks and Synergies windows
set ShowSecondaryPerks on // display of dependancies in Perk window
set InventoryBackgroundColorBlue on // make inventory background color blue instead of red (for equipped and occupied slots), off by default
set InventoryBackgroundOldStyle on // works if InventoryBackgroundColorBlue is activated: unidentified items will have magenta background, unequippable - red
set InventoryTurnOffRedColorItems off // works if InventoryBackgroundColorBlue is enabled: does not paint unequippable items red
set ShowSystemTime on // displays current time in upper left part of the screen
set ShowPlayerAuraHitVisual on // auras (Psion, Holy Templar, Devastator) from player show visual effect of hit on monsters, on by default
set ShowGameMode on // displays game mode in upper left corner of the screen, off by default
set ForceZoom off // force playing with zoom on, and inability to zoom out, off by default (does not work with DynamicZoom active)
set ShowResolution off // display resolution used in upper left corner of the screen, off by default
set ScreenCenterUserShiftVertical 0 // shifts player position on the screen. Value can range from -2 to 2 (default is 0). Use it only if you absolutely have to
set OnScreenTextOutline on // outlines ingame onscreen info texts for better visibility (on by default)
set OriginalLightLevels on // on by default, this option returns level lighting (mostly affects Abyss & Crypt) to what it was in original game (Hellfire) and in previous versions of the mod
set lovecraft off // off by default, this option makes you see monsters only when they are in radius of 3 tiles of closer (and in line of sight of course)
set RelixToScrolls off // off by default, this option will replace all relict icons with scroll pics (just like it was in OG)
set DisplayMonstersLeft on // off by default, if activated it will display monster counter left in all dungeons (does not work in Coliseum and Town)
set FullscreenFX 0 // no additional visual effects ("0"), Vignette effect ("1"), fog of war ("2"), both 1+2 ("3"), bloom effect ("5")
set PixelLight on // on by default, this activates per pixel lighting that produces smoother illumination. it's a little taxing on CPU as well, set to off to go back to per-tile lighting
set MultiThreadPixelLight on // on by default (works only if PixelLight option is activated), it uses multiple cores in CPU, improving performance of Pixel Lighting
set EnrichedLightEnhanced off // smoother per-pixel light falloff (needs PixelLight ON)
set EnrichedLightUltra off // Smoother per-pixel lighting with proper transparency and colored lighting support (Recommends MultiThreadPixelLight ON, fullscreen ON for best performance)
set ShowMinionBars off // shows minion HP bars in the left mid part of the screen, for summoners and for Warlord
set Display_Player_HP_bars off // shows thin HP bar over player heads (including minions)
set Display_Monster_HP_bars off // shows thin HP bars over monster heads
set Show_Reflect_Layers on // when activated this option shows number of Reflect layers on top of your Reflect icon above your head (you don't see Reflect layers of other players)
set total_kills off // off by default, it shows your lifetime monster kills with current character if you hover name slot in char.panel (only works in SP)
set SharpScaling off // off by default. Sharper picture: pixels are enlarged crisply first, then smoothed only at the seams. May get grainy/pixelated. Use with caution.
set FSR off // FSR - AMD FidelityFX Super Resolution 1.0 upscaler. Makes the picture sharper and edges smoother. Overrides SharpScaling.
set FSRSharpness 4 // FSR sharpening degree: 0 = sharpest ... 20 = softest (default 4).
set FilmGrain off // Animated film grain: off, on (= 3), or 1 ... 10. Default is off.
set ChromaticAberration off // Colour fringing toward the screen corners: off, on (= 3), or 1 ... 10. Default is off.
set GrottoTrip on // strong color fringing in Mossy Grotto that grows near Fungal Roots. On means it's active, Off uses ChromaticAberration setting.
set HeatHaze 3 // Heat shimmer above burning lava. Settings: off, on (= 5), or 1 ... 10. Default is 3.
set Perspective off // Tilted ground view similar to Diablo II's perspective mode: off, on (= 5), or 1 ... 10. Default is off
set Shockwave 4 // Distortion effect from Exploder explosions and Fireblast impacts: off, on (= 5), or 1 ... 10. Default is 5.
set WaterShimmer 8 // Gentle ripples on the water of Fetid Cavern: off, on (= 5), or 1 ... 10. Default is 8.
set TiltShift off // Miniature look: soft blur at the top and bottom of the world view: off, on (= 5), or 1 ... 10. Default is off. (Note: may work well with Perspective)
set CRT off // Old monitor look: scanlines and phosphor mask: off, on (= 5), or 1 ... 10. Default is off.
set Antialiasing off // options: off / fxaa / smaa (on means SMAA)
set AutomapShadow on // automap lines get dark outlines for better visibility over bright surface. Default on.
set IceFrost 7 // frost creeps in from the screen edges while you stand still (Ice Age, Glacial Caverns, Frozen Loch): off, on (= 7), or 1 ... 10
set IceAgeTreeSnow on // Ice Age: the trees in Tristram and Ravenholm are covered in snow and hoarfrost. On by default.

// post-processing effects below -------------------------------------->>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
// old machine look for the whole screen: off, or 1 Game Boy, 2 Game Boy Pocket, 3 Virtual Boy, 4 CGA, 5 EGA, 6 C64, 7 NES, 8 amber monitor, 9 green monitor, 
// 10 sepia, 11 1-bit Mac, 12 newspaper, 13 pixelate, 14 PS1, 15 PC-98, 16 ZX Spectrum, 17 ASCII, 18 Teletext, 19 old VHS tape. Default is off. (Note: try 9 with CRT)
set RetroMode 0
set RetroPixel 0 // pixel size for RetroMode: 0 = the mode's own size, or 1 ... 8. Default is 0.
//---------------------------------------------------------------------<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

set LevelUpGlow off // a golden ring bursts out from the hero and a pillar of light rises on a level-up. Default is off.
set CloudShadows 9 // shadows of clouds drift over the town by day: off, on (= 9), or 1 ... 10. Default is on.
set TreeSway 4 // makes town and Ravenholm trees sway: off, on (= 5), or 1 ... 10. Default is 4. (Careful: can be taxing on performance).
set WetGround 5 // Tristram gets wet in the rain of storm nights and dries out over the next day: darker ground, puddles with reflections and raindrop rings: off, on (= 5), or 1 ... 10. Default is on.
set ColdBreath 5 // breath vapour in the cold (Ice Age, Glacial Caverns, Frozen Loch): heroes, townsfolk, cows and living monsters breathe out puffs of mist: off, on (= 5), or 1 ... 10. Default is on.
set SunRays 2 // shafts of sunlight fall through Tristram's trees during the sunny spell of a sunny day: off, on (= 2), or 1 ... 10. Default is 2. (Careful: can be taxing on performance).
set GrassBlades on // blades of grass in Tristram and Ravenholm that sway when the wind blows (not in Classic or under Ice Age): off, on (= 10), or 1 ... 10 (how tall). Default is on.
set GrassResolution 1 // 0 = draws grass at window resolution (heaviest on GPU). 1 = draws at game resolution (less GPU load). 2 = draws at half game resolution (fastest, softest blades). Default is 2.
set IceAgeRiverMirror off // Ice Age: by day the river in Tristram mirrors a blue winter sky with drifting clouds. Off by default.



//----- LOCALIZATION -----

// english 0, russian 1, indonesian 2, portuguese 3, spanish 4, italian 5, french 6, polish 7, chinese 8, german 9, turkish 10, 
// korean 11, danish 12, bulgarian 13, dutch 14, ukrainian 15, japanese 16, arabic 17, hindi 18, swahili 19, czech 20, croatian 21
set language 0



//----- COMBAT TEXT -----

set showCombatText on // set to "on" to turn on combat texts globally
set showCombatExp on // show XP from monsters
set showPercentExpGain off // show level-up gain percentage for current kill
set mergeCombatTexts on // merge spamming combat texts together to reduce amount of simultaneous messages
set showReceivedDamage on // toggle damage display on player
set receivedDamageThreshold 2 // minimum HP loss to show red damage text on player
set showInflictedDamage on // toggle damage display on monsters
set MonsterReceivedDamageThreshold 3 // adjust threshold of damage displayed, raise the numbers to reduce spamming
set showBreakWarning on //toggle item break warnings on/off
set showHPRegen off // display player's regen rate of life as floating numbers
set showMPRegen off // same with mana
set floatingHPRegenThreshold 0 // adjust threshold of displayed player HP regen per second, raise the numbers to reduce spamming
set floatingManaRegenThreshold 0 // same as HP



