set NewShortcuts on // if set to ON - activates customizable hotkeys pre-planned below, on by default
set SkipUnusableSpells on // if set to off, will select unusable spells while scrolling through hotkeyed spells
set ExpandedSpellsOnScroll on // if set to off, will only mouse-scroll through F1-F8 keys, otherwise (when on) will include A-Z keys and CTRL

